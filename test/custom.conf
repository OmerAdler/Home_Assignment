# test/custom.conf — mounted identically into BOTH containers at
# /etc/nginx/conf.d/zz-custom.conf to prove config-level compatibility, not just
# default-image behavior.
#
# Several directives here double as module-presence assertions: if the image were
# built without --with-http_stub_status_module or --with-http_sub_module, nginx
# would fail to start with "unknown directive" and the test would catch it at boot
# rather than needing a separate check.

server {
    listen       8081;
    server_name  localhost;

    # deliberately different from the 1m default, to prove overrides are honored
    client_max_body_size 2m;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    # custom status code via return
    location = /teapot {
        return 418 "I am a teapot\n";
    }

    # custom response header (add_header)
    location = /custom-header {
        add_header X-Compat-Test "echo-value" always;
        return 200 "ok\n";
    }

    # exercises --with-http_stub_status_module (body is counters => volatile)
    location = /stub_status {
        stub_status;
    }

    # exercises --with-http_sub_module: rewrites body content on the fly
    location = /subfilter {
        root       /usr/share/nginx/html;
        sub_filter 'Welcome to nginx!' 'Welcome to ECHO!';
        sub_filter_once on;
        try_files  /index.html =404;
    }

    # exercises --with-http_realip_module being compiled in
    location = /realip {
        set_real_ip_from 127.0.0.1;
        real_ip_header   X-Forwarded-For;
        return 200 "realip-ok\n";
    }
}
